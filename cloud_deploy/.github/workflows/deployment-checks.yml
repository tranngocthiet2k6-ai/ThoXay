name: Check cloud deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: thoxay_upgrade_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thoxay_upgrade_qa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify PostgreSQL fresh install, existing data and repeat migrations
        env:
          THOXAY_PG_TEST_URL: jdbc:postgresql://localhost:5432/thoxay_upgrade_qa
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=MigrationCompatibilityTest test

  backend-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and test Java 17 production container
        run: docker build --tag thoxay-deployment-check .

  vercel-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check deployment settings
        run: node --test scripts/deployment.test.mjs scripts/tests/*.test.cjs
      - name: Exercise the Vercel build command
        env:
          # Validation build only. Vercel uses its own real API_BASE_URL setting.
          API_BASE_URL: https://thoxay-ci.example.com
        run: node scripts/build-vercel.mjs
      - name: Analyze and test Flutter with the downloaded SDK
        working-directory: mobile_app
        run: |
          FLUTTER="$GITHUB_WORKSPACE/.vercel/cache/flutter-$(cat ../.flutter-version)/flutter/bin/flutter"
          "$FLUTTER" analyze
          "$FLUTTER" test

<!doctype html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ảnh tay nghề · ThoXay Admin</title><link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/css/admin.css}" rel="stylesheet"></head>
<body><main class="container py-4"><a th:href="@{/admin/dashboard}" class="btn btn-outline-primary mb-4">← Quản trị</a><h1 class="h3 mb-4">Ảnh tay nghề thực tế</h1>
<p class="alert alert-info" th:if="${photos.isEmpty()}">Hồ sơ chưa tải ảnh tay nghề.</p>
<div class="row g-4"><article class="col-12 col-md-6 col-xl-4" th:each="photo : ${photos}"><div class="card h-100"><button type="button" class="btn p-0" data-bs-toggle="modal" data-bs-target="#photoZoom" th:attr="data-image=@{/admin/portfolio/photos/{id}(id=${photo.id})},data-caption=${photo.caption}"><img th:src="@{/admin/portfolio/photos/{id}(id=${photo.id})}" class="w-100 rounded-top" style="height:220px;object-fit:cover" loading="lazy" alt="Ảnh tay nghề, bấm để phóng to"></button><div class="card-body"><p class="mb-0" th:text="${photo.caption.isEmpty() ? 'Ảnh công trình' : photo.caption}"></p></div></div></article></div>
<div class="modal fade" id="photoZoom" tabindex="-1" aria-labelledby="photoTitle" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5" id="photoTitle">Ảnh tay nghề</h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Đóng"></button></div><div class="modal-body text-center" style="overflow:auto"><img id="fullPhoto" class="img-fluid" style="max-height:80vh" alt="Ảnh tay nghề phóng to"></div></div></div></div>
</main><script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script><script th:src="@{/js/admin-portfolio.js}"></script></body></html>

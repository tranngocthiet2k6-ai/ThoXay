<!doctype html>
<html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chấm công · ThoXay Admin</title><link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/css/admin.css}" rel="stylesheet"></head>
<body><main class="container py-4"><a th:href="@{/admin/dashboard}" class="btn btn-outline-primary mb-4">← Quản trị</a><h1 class="h3">Chấm công và ảnh nghiệm thu</h1><p class="text-secondary">Ngày/giờ Việt Nam. Chủ thầu trực tiếp nghiệm thu; Admin xem đối chiếu khi hỗ trợ công trình.</p>
<form method="get" class="d-flex gap-3 mb-4 align-items-end" th:action="@{/admin/jobs/{id}/attendance(id=${jobId})}"><div><label for="workday" class="form-label">Ngày làm việc</label><input type="date" class="form-control" id="workday" name="day" th:value="${selectedDay}" required></div><button class="btn btn-primary">Xem ngày</button></form>
<div th:if="${data.items.isEmpty()}" class="alert alert-info">Chưa có chấm công trong ngày này.</div>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Thợ / đơn</th><th>Vào / Ra</th><th>Ảnh và kết quả</th><th>Nghiệm thu</th></tr></thead><tbody><tr th:each="row : ${data.items}">
<td><strong th:text="${row.workerName}"></strong><div th:text="'Đơn #' + ${row.applicationId}"></div></td>
<td><div th:text="${#temporals.format(row.checkedInAt.atZone(T(java.time.ZoneId).of('Asia/Ho_Chi_Minh')), 'HH:mm')} + ' · ' + ${row.checkinMethod}"></div><div th:text="${row.checkedOutAt == null ? 'Chưa check-out' : #temporals.format(row.checkedOutAt.atZone(T(java.time.ZoneId).of('Asia/Ho_Chi_Minh')), 'HH:mm') + ' · ' + row.checkoutMethod}"></div></td>
<td><th:block th:if="${row.logId != null}"><button type="button" class="btn p-0 mb-2" data-bs-toggle="modal" data-bs-target="#photoZoom" th:attr="data-image=@{/admin/work-logs/{id}/photo(id=${row.logId})},data-caption=${row.caption}"><img th:src="@{/admin/work-logs/{id}/photo(id=${row.logId})}" width="180" height="120" class="rounded" style="object-fit:cover" loading="lazy" alt="Ảnh công việc, bấm để phóng to"></button><p class="mb-0" th:text="${row.caption}"></p></th:block><span th:if="${row.logId == null}" class="text-secondary">Chưa gửi ảnh</span></td>
<td><span class="badge" th:classappend="${row.reviewStatus == 'APPROVED' ? 'bg-success' : 'bg-warning text-dark'}" th:text="${row.reviewStatus == 'APPROVED' ? 'Đã nghiệm thu' : (row.reviewStatus == 'CHANGES_REQUESTED' ? 'Cần bổ sung' : 'Đang chờ')}"></span><p class="small mt-2" th:text="${row.feedback}"></p></td>
</tr></tbody></table></div>
<nav class="d-flex gap-3"><a th:if="${page > 0}" th:href="@{/admin/jobs/{id}/attendance(id=${jobId},day=${selectedDay},page=${page - 1})}" class="btn btn-outline-primary">Trang trước</a><a th:if="${data.hasMore}" th:href="@{/admin/jobs/{id}/attendance(id=${jobId},day=${selectedDay},page=${page + 1})}" class="btn btn-outline-primary">Trang sau</a></nav>
<div class="modal fade" id="photoZoom" tabindex="-1" aria-labelledby="photoTitle" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5" id="photoTitle">Ảnh cuối ngày</h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Đóng"></button></div><div class="modal-body text-center" style="overflow:auto"><img id="fullPhoto" class="img-fluid" style="max-height:80vh" alt="Ảnh công việc phóng to"></div></div></div></div>
</main><script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script><script th:src="@{/js/admin-work-logs.js}"></script></body></html>

<!doctype html><html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOS &amp; Sự cố · ThoXay Admin</title><link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/css/admin.css}" rel="stylesheet"></head><body><main class="container py-4">

<a th:href="@{/admin/incidents}" class="btn btn-outline-primary mb-4">← Danh sách sự cố</a><div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<p class="text-secondary"><span data-incident-sos th:text="${counts.sos}"></span> SOS đang mở trên hệ thống. <a th:href="@{/admin/incidents}">Xem hàng đợi ưu tiên</a></p>
<article class="card p-4 mb-4" th:with="report=${detail.incident}"><div class="d-flex flex-wrap gap-3 align-items-center mb-3"><h1 class="h3 mb-0" th:text="'Báo cáo #' + ${report.id}"></h1><span class="badge" th:classappend="${report.type == 'SOS' ? 'bg-danger' : 'bg-primary'}" th:text="${@incidentLabels.type(report.type)}"></span><span class="badge bg-secondary" th:text="${@incidentLabels.status(report.status)}"></span></div><h2 class="h5" th:text="${report.jobTitle}"></h2><p th:text="${report.jobAddress}"></p><p><strong th:text="${report.reporterName}"></strong> · <a th:href="'tel:' + ${report.reporterPhone}" th:text="${report.reporterPhone}"></a></p><p style="white-space:pre-wrap" th:text="${report.description}"></p>
<p class="text-secondary" th:text="${report.reportedLatitude == null ? 'Chưa có GPS người báo cáo; bên dưới là vị trí công trình đã lưu.' : 'GPS do người báo cáo gửi kèm.'}"></p><a class="btn btn-outline-primary align-self-start" target="_blank" rel="noopener noreferrer" th:href="@{https://www.google.com/maps/search/(api=1,query=${(report.reportedLatitude == null ? report.jobLatitude : report.reportedLatitude) + ',' + (report.reportedLongitude == null ? report.jobLongitude : report.reportedLongitude)})}">Mở vị trí trên bản đồ</a>
</article>
<form th:if="${detail.incident.status != 'RESOLVED'}" method="post" th:action="@{/admin/incidents/{id}(id=${detail.incident.id})}" class="card p-4 mb-4"><h2 class="h5">Cập nhật xử lý</h2><input type="hidden" name="version" th:value="${detail.incident.version}"><label class="form-label" for="result">Trạng thái</label><select id="result" name="status" class="form-select mb-3"><option value="IN_REVIEW">Đã tiếp nhận / đang xử lý</option><option value="RESOLVED">Đã có kết quả</option></select><label class="form-label" for="note">Ghi chú / kết quả xử lý</label><textarea id="note" name="note" maxlength="1000" class="form-control mb-3" rows="4" th:text="${detail.incident.adminNote}"></textarea><p class="small text-secondary">Ghi rõ kết quả trước khi kết thúc. Giao dịch ví vẫn được đối soát trong phân hệ Ví.</p><button class="btn btn-primary align-self-start">Lưu và thông báo người báo cáo</button></form>
<section class="card p-4"><h2 class="h5">30 cập nhật gần nhất</h2><div class="border-bottom py-3" th:each="entry : ${detail.history}"><strong th:text="${@incidentLabels.status(entry.status)}"></strong> · <small th:text="${@incidentLabels.time(entry.createdAt)}"></small><p class="mb-0 mt-2" style="white-space:pre-wrap" th:text="${entry.note}"></p></div></section>
</main><script defer th:src="@{/js/admin-incidents.js}"></script></body></html>

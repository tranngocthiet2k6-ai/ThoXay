<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="queues" class="row g-4 mb-4 control-queues" aria-label="Hàng chờ ưu tiên">
 <div class="col-12 col-xl-6"><section class="card admin-panel h-100"><div class="panel-heading"><div><h2>Đối soát VietQR &amp; Ví</h2><p>Yêu cầu chờ kiểm tra giao dịch thực tế</p></div><a href="/admin/wallet" class="btn btn-sm btn-outline-primary">Xem tất cả ↗</a></div>
 <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Yêu cầu</th><th>Số tiền</th><th>Đối soát</th></tr></thead><tbody>
 <tr th:if="${walletQueue.items.isEmpty()}"><td colspan="3" class="text-secondary py-4">Không có lệnh nạp / rút chờ xử lý.</td></tr>
 <tr th:each="request:${walletQueue.items}"><td><strong th:text="${request.fullName}"></strong><div class="small text-secondary" th:text="${request.kind == 'TOP_UP' ? 'Nạp tiền' : 'Rút tiền'} + ' · #' + ${request.id}"></div></td><td class="salary-cell" th:text="${#numbers.formatInteger(request.amount,1,'POINT')} + ' đ'"></td><td><span class="badge badge-amber">Chờ đối soát</span><div class="small text-secondary" th:if="${request.depositReference != null}" th:text="${request.depositReference}"></div></td></tr>
 </tbody></table></div></section></div>
 <div class="col-12 col-xl-6"><section class="card admin-panel h-100"><div class="panel-heading"><div><h2>Sự cố &amp; tranh chấp</h2><p>SOS được ưu tiên trong hàng chờ</p></div><a href="/admin/incidents" class="btn btn-sm btn-outline-primary">Xử lý ↗</a></div>
 <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Báo cáo</th><th>Công trình</th><th>Ưu tiên</th></tr></thead><tbody>
 <tr th:if="${incidentQueue.items.isEmpty()}"><td colspan="3" class="text-secondary py-4">Không có sự cố mới cần xử lý.</td></tr>
 <tr th:each="incident,stat:${incidentQueue.items}" th:if="${stat.index < 4}"><td><a th:href="@{/admin/incidents/{id}(id=${incident.id})}" th:text="${incident.reporterName}"></a><div class="small text-secondary" th:text="'Báo cáo #' + ${incident.id}"></div></td><td class="queue-job" th:text="${incident.jobTitle}"></td><td><span class="badge" th:classappend="${incident.type == 'SOS' ? 'badge-red' : 'badge-blue'}" th:text="${incident.type == 'SOS' ? 'SOS khẩn cấp' : 'Chờ tiếp nhận'}"></span></td></tr>
 </tbody></table></div></section></div>
</section></body></html>

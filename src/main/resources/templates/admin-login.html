<!doctype html>
<html data-bs-theme="dark" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập quản trị · Thợ Xây</title>
  <link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet">
  <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body class="login-page">
  <main class="card login-card border-0 shadow-sm p-4 p-sm-5">
    <div class="brand-mark mb-4">TX</div>
    <p class="eyebrow">THỢ XÂY · QUẢN TRỊ</p>
    <h1 class="h3 fw-bold mb-2">Chào mừng trở lại</h1>
    <p class="text-secondary mb-4">Đăng nhập để quản lý tài khoản và công trình.</p>
    <div th:if="${param.error}" class="alert alert-danger" role="alert">Sai thông tin đăng nhập hoặc tài khoản đã bị khóa.</div>
    <div th:if="${param.expired}" class="alert alert-warning" role="alert">Phiên đăng nhập đã hết hạn. Vui lòng nhập lại thông tin để tiếp tục.</div>
    <div th:if="${param.logout}" class="alert alert-success" role="status">Bạn đã đăng xuất thành công.</div>
    <form th:action="@{/admin/login}" method="post">
      <label class="form-label" for="phoneNumber">Số điện thoại quản trị</label>
      <input class="form-control form-control-lg mb-3" id="phoneNumber" name="phoneNumber" type="tel" autocomplete="username" required maxlength="15">
      <label class="form-label" for="password">Mật khẩu</label>
      <input class="form-control form-control-lg mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary btn-lg w-100" type="submit">Đăng nhập</button>
    </form>
    <p class="small text-secondary mt-4 mb-0">Khu vực dành cho tài khoản quản trị hệ thống.</p>
  </main>
</body>
</html>

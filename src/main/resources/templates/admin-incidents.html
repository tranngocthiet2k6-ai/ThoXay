<!doctype html><html lang="vi" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOS &amp; Sự cố · ThoXay Admin</title><link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet"><link th:href="@{/css/admin.css}" rel="stylesheet"></head><body><main class="container py-4">

<a th:href="@{/admin/dashboard}" class="btn btn-outline-primary mb-4">← Tổng quan quản trị</a><div class="d-flex flex-wrap gap-3 align-items-center mb-3"><h1 class="h3 mb-0">SOS &amp; Sự cố công trình</h1><span class="badge bg-danger"><span data-incident-sos th:text="${counts.sos}"></span> SOS đang mở</span><span class="badge bg-primary"><span data-incident-count th:text="${counts.open}"></span> báo cáo chưa kết thúc</span><a th:href="@{/admin/incidents}" class="btn btn-outline-primary btn-sm">Xem báo cáo mới</a></div>
<p class="text-secondary">Ưu tiên SOS trước, sau đó theo báo cáo mới nhất. Nội dung chỉ người báo cáo và Admin được xem.</p>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<form method="get" th:action="@{/admin/incidents}" class="card p-3 mb-4"><div class="row g-3"><div class="col-md-4"><label for="search" class="form-label">Tìm công trình, người báo cáo, nội dung</label><input type="search" id="search" name="q" class="form-control" maxlength="100" th:value="${query}"></div><div class="col-md-3"><label for="status" class="form-label">Trạng thái</label><select id="status" name="status" class="form-select"><option value="NEW" th:selected="${filterStatus == 'NEW'}">Mới gửi</option><option value="IN_REVIEW" th:selected="${filterStatus == 'IN_REVIEW'}">Đang xử lý</option><option value="RESOLVED" th:selected="${filterStatus == 'RESOLVED'}">Đã có kết quả</option></select></div><div class="col-md-3"><label for="type" class="form-label">Loại báo cáo</label><select id="type" name="type" class="form-select"><option value="">Tất cả</option><option value="SOS" th:selected="${filterType == 'SOS'}">SOS</option><option value="SAFETY" th:selected="${filterType == 'SAFETY'}">An toàn công trường</option><option value="PAYMENT_DISPUTE" th:selected="${filterType == 'PAYMENT_DISPUTE'}">Tranh chấp thanh toán</option><option value="OTHER" th:selected="${filterType == 'OTHER'}">Khác</option></select></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100">Lọc báo cáo</button></div></div></form>
<div class="alert alert-info" th:if="${queue.items.isEmpty()}">Không có báo cáo trong bộ lọc này.</div>
<article class="card p-4 mb-3" th:each="report : ${queue.items}"><div class="d-flex flex-wrap justify-content-between gap-3"><div><span class="badge mb-2" th:classappend="${report.type == 'SOS' ? 'bg-danger' : 'bg-primary'}" th:text="${@incidentLabels.type(report.type)}"></span><h2 class="h5" th:text="'#' + ${report.id} + ' · ' + ${report.jobTitle}"></h2><p class="text-secondary mb-2" th:text="${report.reporterName} + ' · ' + ${@incidentLabels.time(report.createdAt)}"></p></div><a class="btn btn-outline-primary align-self-start" th:href="@{/admin/incidents/{id}(id=${report.id})}">Xem &amp; xử lý</a></div><p class="mb-0" style="white-space:pre-wrap" th:text="${#strings.abbreviate(report.description,240)}"></p></article>
<nav class="d-flex gap-3"><a th:if="${page > 0}" th:href="@{/admin/incidents(status=${filterStatus},type=${filterType},q=${query},page=${page - 1})}" class="btn btn-outline-primary">Trang trước</a><a th:if="${queue.hasMore}" th:href="@{/admin/incidents(status=${filterStatus},type=${filterType},q=${query},page=${page + 1})}" class="btn btn-outline-primary">Trang sau</a></nav>
</main><script defer th:src="@{/js/admin-incidents.js}"></script></body></html>

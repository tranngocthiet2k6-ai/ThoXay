spring.application.name=tho-xay
spring.config.import=optional:file:.local/application.properties
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tho_xay_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.thymeleaf.cache=false
server.error.include-message=never
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}

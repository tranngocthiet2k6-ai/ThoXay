services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tho_xay_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tho_xay_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
